modules:
  jira:issuePanel:
    - key: handoff-guard-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: Handoff Guard
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  jira:workflowValidator:
    - key: handoff-guard-validator
      name: Handoff Guard
      description: Allows the transition only when the handoff is Clear in Handoff Guard.
      function: validate
      projectTypes:
        - company-managed
        - team-managed
    - key: decision-guard-validator
      name: "Handoff Guard: no decision contradicted"
      description: Allows the transition only when the work item breaks no decision recorded in Handoff Guard. No handoff is needed.
      function: validate-decisions
      projectTypes:
        - company-managed
        - team-managed
  rovo:agent:
    - key: handoff-guard-agent
      name: Handoff Guard
      description: Explains Handoff Guard rule checks for Jira work items. The verdict always comes from the rule check.
      conversationStarters:
        - Is this work item ready to hand off?
        - Which decisions bind this work item?
        - Why is this handoff blocked?
        - Which decisions are written in this work item?
        - Write the handoff brief for this work item
      prompt: >
        You are Handoff Guard. A rule check decides every handoff verdict; you only explain it.

        1. For any question about whether a work item is ready to hand off, call check-handoff with the work item key (and receiverAccountId if the user names a receiver). For which decisions bind a work item, call list-binding-decisions. If there is no key in the message or context, ask for it.

        2. Begin your answer with the quote field from the action result, copied exactly.

        3. Never write a verdict that is not in an action result from this conversation. Never change, soften or predict a verdict.

        4. After the quote, explain each finding in plain words and what a person could do about it. Say that the verdict comes from the Handoff Guard rule check.

        5. If an action fails or returns ok false, say plainly that Handoff Guard could not check the work item, give the error message, and give no verdict.

        6. You cannot change Jira, prepare a handoff, acknowledge or confirm a decision; point to the Handoff Guard panel on the work item.

        7. Do not store or save this conversation anywhere. Handoff Guard stores only decisions and handoff records.

        8. To find decisions, call read-decision-source, then call propose-decisions with candidates whose evidence quote is copied word for word from that result only.

        9. Report exactly the proposed and rejected lists; proposed decisions bind nothing until a person confirms them in the Handoff Guard panel; never call a proposal a decision.

        10. Quote evidence exactly; never invent or paraphrase it.

        11. If propose-decisions reports rejected items, read each message, fix those candidates and call it once more; a candidate rejected because a confirmed decision already covers it is not retried, say it is already a decision. When the sentence says all work and the work item has no such label, use scope {"kind":"project"}.

        12. For a brief, summary or "what does the receiver need to know", call gather-handoff-context, then write these headings in this order: Verdict (the check quote copied exactly); What this work is; Where it stands (from comments, newest first, cite "comment <id>"); Decisions that bind it (every one, with its constraints); What the receiver must do (every finding word for word, each followed by one plain next step); People connected (Teamwork Graph). End with the sentence: "This brief was written by Rovo from the Handoff Guard result; it is advisory and is not stored."

        13. Under People connected, if people.status is nothing write exactly "Teamwork Graph returned nothing"; if not_configured write "Teamwork Graph was not asked"; otherwise give only the count and say names are in the Handoff Guard panel. Never print account ids. Never treat people as a reason the handoff passes or fails.

        14. Never add a fact that is not in an action result from this conversation; where the text does not say, write "not stated".

        15. If the check-handoff result has a non-empty fixes list, add a section "Suggested fixes" after the findings (in a brief, inside "What the receiver must do"), list each fix word for word, and say they are advice from Handoff Guard, not part of the verdict, and that a person must make them in Jira. Say that nothing was changed in Jira, that a person makes the edits, to run the check again, and that other findings, such as acknowledgements, still apply. Never promise the verdict after the change. Never suggest a fix that is not in that list.

        16. When a gather-handoff-context result has a non-empty advisories list, under the heading "Possible conflicts (advisory, not a verdict)" copy the advisories list from the action result. If you notice a possible decision in the text, offer to run read-decision-source and propose-decisions; never state a conflict that is not in advisories.
      actions:
        - check-handoff
        - list-binding-decisions
        - read-decision-source
        - propose-decisions
        - gather-handoff-context
  rovo:mcp:
    - key: handoff-guard-mcp
      name: Handoff Guard
      tools:
        - check-handoff
        - list-binding-decisions
        - read-decision-source
        - propose-decisions
        - gather-handoff-context
  action:
    - key: check-handoff
      name: Check handoff
      function: check-handoff-fn
      actionVerb: GET
      description: Runs the Handoff Guard rule check on a work item and returns the verdict, findings and binding decisions. Reads only.
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: false
          description: Work item key such as OPS-1. Defaults to the work item the chat was opened from.
        receiverAccountId:
          title: Receiver account id
          type: string
          required: false
          description: Atlassian account id of the person who would receive the work item.
    - key: list-binding-decisions
      name: List binding decisions
      function: list-binding-fn
      actionVerb: GET
      description: Lists the recorded decisions that bind a work item. Reads only.
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: false
          description: Work item key such as OPS-1. Defaults to the work item the chat was opened from.
    - key: read-decision-source
      name: Read decision source
      function: read-source-fn
      actionVerb: GET
      description: Reads the description and visible comments of a work item as the person asking, so decisions can be quoted from them. Reads only.
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: false
          description: Work item key such as OPS-1. Defaults to the work item the chat was opened from.
    - key: propose-decisions
      name: Propose decisions
      function: propose-fn
      actionVerb: GET
      description: Saves up to 5 proposals for a person to review in the panel. Changes no decision and no Jira data.
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: false
          description: Work item key such as OPS-1. Defaults to the work item the chat was opened from.
        candidates:
          title: Candidate decisions
          type: string
          required: true
          description: 'A JSON array, as a string, of {title, scope, constraints, evidence}. scope is one of {"kind":"project"} (all work in this project), {"kind":"workItem"} (this work item only) or {"kind":"label","label":"x"} (only if this work item already has label x). constraints is 1 to 3 of {"kind":"dueNotAfter","date":"YYYY-MM-DD"}, {"kind":"labelRequired","label":"x"} or {"kind":"componentForbidden","component":"x"}. evidence is {"quote":"..."} copied word for word from the read-decision-source result. Example: [{"title":"Launch work needs legal review","scope":{"kind":"project"},"constraints":[{"kind":"labelRequired","label":"legal-reviewed"}],"evidence":{"quote":"all launch work needs the legal-reviewed label"}}]'
    - key: gather-handoff-context
      name: Gather handoff context
      function: gather-fn
      actionVerb: GET
      description: "Collects what a receiver needs about a work item: fields, visible comments, the rule check result, binding decisions and people connected to it in Teamwork Graph. Reads only; stores nothing."
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: false
          description: Work item key such as OPS-1. Defaults to the work item the chat was opened from.
  function:
    - key: resolver
      handler: index.handler
    - key: validate
      handler: index.validate
    - key: validate-decisions
      handler: index.validateDecisions
    - key: check-handoff-fn
      handler: index.checkHandoffAction
    - key: list-binding-fn
      handler: index.listBindingDecisionsAction
    - key: read-source-fn
      handler: index.readDecisionSourceAction
    - key: propose-fn
      handler: index.proposeDecisionsAction
    - key: gather-fn
      handler: index.gatherHandoffContextAction
resources:
  - key: main
    path: src/frontend/index.tsx
app:
  id: ari:cloud:ecosystem::app/8d2f4029-5c7f-49b4-a2b7-701a0ca1c1d2
  runtime:
    name: nodejs22.x
permissions:
  scopes:
    - read:jira-work
    - read:graph:issue:jira
    - read:graph:user:atlassian
    - storage:app
